<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD9EC">
<title>Chúc mừng 20/10</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4B1B57; --soft:#8A3F86; --title:#E0287A;
  --pink:#FF4F93; --pink2:#FF8FB8; --coral:#FF8A6B; --peach:#FFB38F; --gold:#FFD24D;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh; min-height:100svh;
  display:grid; place-items:center;
  padding:max(28px,env(safe-area-inset-top)) 24px max(32px,env(safe-area-inset-bottom));
  background:linear-gradient(160deg,#FFD9EC 0%,#F3D9FF 55%,#D6E6FF 100%) fixed;
  color:var(--ink);
  font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  overflow-x:hidden;
}
main{width:100%;max-width:520px;text-align:center}

/* Bông hoa */
.flower{
  position:relative; display:block; margin:0 auto;
  width:min(76vw,300px); aspect-ratio:1;
  background:none; border:0; cursor:pointer; border-radius:50%;
  -webkit-tap-highlight-color:transparent;
  transition:width .9s cubic-bezier(.4,0,.2,1) .2s;
}
.flower:focus-visible,.music:focus-visible{outline:3px solid var(--title);outline-offset:6px}
.petal{
  position:absolute; left:50%; bottom:50%;
  width:24%; height:42%; margin-left:-12%;
  border-radius:50% 50% 45% 45% / 85% 85% 15% 15%;
  background:linear-gradient(to top,var(--pink),var(--pink2));
  transform-origin:50% 100%;
  transform:rotate(calc(var(--a) * .12)) scale(.42);
  transition:transform 1.1s cubic-bezier(.2,.9,.25,1.12) calc(var(--i) * 45ms);
  z-index:1;
}
.petal.p2{
  width:17%; height:30%; margin-left:-8.5%;
  background:linear-gradient(to top,var(--coral),var(--peach));
  z-index:2;
}
.core{
  position:absolute; left:50%; top:50%; z-index:3;
  width:20%; aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#FFF0A8,var(--gold) 60%,#F5A623);
  transform:translate(-50%,-50%) scale(.7);
  transition:transform .9s cubic-bezier(.2,.9,.25,1.2) .5s;
}
.opened .petal{transform:rotate(var(--a)) scale(1)}
.opened .core{transform:translate(-50%,-50%) scale(1)}
.flower:not(.opened){animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.045)}}
.opened-wrap .flower{width:min(30vw,120px)}

/* Nội dung */
.hint{margin-top:28px;color:var(--soft);font-size:1rem}
.opened-wrap .hint{display:none}
.card{display:none}
.opened-wrap .card{display:block;margin-top:20px;animation:rise .9s .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.photo{
  width:min(78vw,320px); margin:0 auto 24px;
  border:8px solid #fff; border-radius:22px; overflow:hidden;
  box-shadow:0 14px 34px rgba(160,50,120,.28);
  transform:rotate(-2deg);
}
.photo img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
h1{
  font-family:'Dancing Script',cursive; font-weight:700;
  font-size:clamp(2.5rem,11vw,3.6rem); line-height:1.15;
  color:var(--title); margin-bottom:12px;
}
.msg{
  max-width:20em; margin:0 auto;
  font-size:clamp(1.12rem,4.7vw,1.4rem); line-height:1.7; font-weight:400;
}

/* Nút nhạc */
.music{
  position:fixed; z-index:6; top:max(14px,env(safe-area-inset-top)); right:14px;
  width:44px; height:44px; border-radius:50%; border:0; cursor:pointer;
  background:rgba(255,255,255,.85); color:var(--title); font-size:1.3rem;
  box-shadow:0 4px 14px rgba(160,50,120,.2); display:none;
}
.opened-wrap .music{display:block}
.music.off{color:var(--soft);opacity:.7}
.music.off::after{content:"";position:absolute;left:11px;right:11px;top:21px;height:2px;background:currentColor;transform:rotate(-45deg)}
.music[hidden]{display:none!important}

/* Cánh hoa rơi */
.fall{position:fixed;top:0;z-index:5;border-radius:60% 0 60% 0;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .flower:not(.opened){animation:none}
  .petal,.core,.flower{transition-duration:.01s;transition-delay:0s}
  .opened-wrap .card{animation:none}
}
</style>
<noscript><style>.card{display:block}.hint{display:none}</style></noscript>
</head>
<body>
<main id="wrap">
  <button class="flower" id="flower" type="button" aria-expanded="false" aria-label="Mở bông hoa">
    <span class="core"></span>
  </button>

  <p class="hint">Chạm vào bông hoa nhé</p>

  <section class="card" aria-live="polite">
    <figure class="photo"><img src="photo.jpg" alt="Ảnh kỷ niệm"></figure>
    <h1>Chúc mừng 20/10</h1>
    <p class="msg">Chúc Sy Sy quốc tế phụ nữ vui vẻ và hạnh phúc, gặp nhiều may mắn trong cuộc sống</p>
  </section>
</main>

<button class="music" id="music" type="button" aria-label="Tắt nhạc">♪</button>
<audio id="song" src="a-thousand-years.mp3" loop preload="auto"></audio>

<script>
(function () {
  var flower = document.getElementById('flower');
  var wrap = document.getElementById('wrap');
  var core = flower.querySelector('.core');
  var song = document.getElementById('song');
  var musicBtn = document.getElementById('music');

  // 2 lớp cánh hoa: 8 cánh lớn + 8 cánh nhỏ xen kẽ
  [[0, ''], [22.5, 'p2']].forEach(function (layer, li) {
    for (var k = 0; k < 8; k++) {
      var p = document.createElement('span');
      p.className = 'petal ' + layer[1];
      p.style.setProperty('--a', (k * 45 + layer[0]) + 'deg');
      p.style.setProperty('--i', k + li * 4);
      flower.insertBefore(p, core);
    }
  });

  function shower() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var colors = ['#FF4F93', '#FF8FB8', '#FFA987', '#FFD24D'];
    for (var i = 0; i < 28; i++) {
      var s = document.createElement('i');
      var size = 10 + Math.random() * 12;
      s.className = 'fall';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.width = size + 'px';
      s.style.height = size * 1.3 + 'px';
      s.style.background = colors[i % 4];
      document.body.appendChild(s);
      var drift = (Math.random() - 0.5) * 160;
      var spin = 360 * (Math.random() + 0.5);
      var a = s.animate([
        { transform: 'translate(0,-10vh) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + drift + 'px,110vh) rotate(' + spin + 'deg)', opacity: 0.9 }
      ], { duration: 4500 + Math.random() * 3500, delay: Math.random() * 1800, easing: 'ease-in', fill: 'backwards' });
      a.onfinish = (function (el) { return function () { el.remove(); }; })(s);
    }
  }

  function setMusicUI(on) {
    musicBtn.classList.toggle('off', !on);
    musicBtn.setAttribute('aria-label', on ? 'Tắt nhạc' : 'Bật nhạc');
  }

  flower.addEventListener('click', function () {
    var open = !flower.classList.contains('opened');
    flower.classList.toggle('opened', open);
    wrap.classList.toggle('opened-wrap', open);
    flower.setAttribute('aria-expanded', open);
    flower.setAttribute('aria-label', open ? 'Đóng bông hoa' : 'Mở bông hoa');
    if (open) {
      shower();
      var pr = song.play();
      if (pr && pr.catch) pr.catch(function () {});
      setMusicUI(true);
    } else {
      song.pause();
    }
  });

  musicBtn.addEventListener('click', function () {
    if (song.paused) { song.play().catch(function () {}); setMusicUI(true); }
    else { song.pause(); setMusicUI(false); }
  });

  // Nếu chưa có file nhạc thì ẩn nút nhạc
  song.addEventListener('error', function () { musicBtn.hidden = true; });
})();
</script>
</body>
</html>
